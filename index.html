<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>彩序迷宮 · NNECOO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><strong>彩序迷宮</strong><span>Now Need Escape · Color · Order · Oblivion</span></div>
      <section class="dashboard" aria-label="遊戲資訊">
        <div class="stat"><span>STEP</span><strong id="steps">0</strong></div>
        <div class="stat"><span>VIS</span><strong id="vision">2</strong></div>
        <div class="stat"><span>MEM</span><strong id="memory">3</strong></div>
        <div class="stat level-name"><span>LEVEL</span><strong id="level-name">01/10</strong></div>
        <div class="menu"><select id="level-select" aria-label="選擇關卡"></select><button id="restart" type="button" title="重置目前關卡">重置</button></div>
      </section>
    </header>
    <section class="order-panel" aria-label="彩色順序"><div class="order-label"><span>彩序</span><span id="order-hint">尋找紅色</span></div><div id="order" class="order"></div></section>
    <div id="board-host" class="board-host">
      <div id="maze-control-wrapper" class="maze-control-wrapper">
        <button class="maze-arrow maze-arrow-up" type="button" data-dir="up" aria-label="迷宮外框：向上移動">↑</button>
        <button class="maze-arrow maze-arrow-down" type="button" data-dir="down" aria-label="迷宮外框：向下移動">↓</button>
        <button class="maze-arrow maze-arrow-left" type="button" data-dir="left" aria-label="迷宮外框：向左移動">←</button>
        <button class="maze-arrow maze-arrow-right" type="button" data-dir="right" aria-label="迷宮外框：向右移動">→</button>
        <div id="board" class="board" role="grid" aria-label="迷宮"></div>
      </div>
      <pre id="debug-panel" class="debug-panel" hidden></pre><div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <section class="bottom">
      <p class="legend"><span class="legend-items">● 玩家　🔴🟠🟡🟢🔵🟣 目標　✦ NNE　✧ COO　▣ 出口</span><span class="mobile-controls-hint">點迷宮四周箭頭或下方方向鍵</span></p>
      <div class="help"><span>WASD / 方向鍵</span><button id="debug" type="button" aria-pressed="false">DEBUG OFF</button></div>
      <div class="controls" aria-label="方向控制">
        <button type="button" data-dir="up" aria-label="向上移動">↑</button>
        <button type="button" data-dir="left" aria-label="向左移動">←</button>
        <button type="button" data-dir="down" aria-label="向下移動">↓</button>
        <button type="button" data-dir="right" aria-label="向右移動">→</button>
      </div>
      <button id="cheat" class="cheat-button" type="button" aria-label="重置並自動執行本關解答">
        <span class="cheat-idle">AUTO SOLVE</span><span class="cheat-running">STOP</span>
      </button>
    </section>
  </main>
  <div id="win" class="modal" hidden><div class="modal-card"><div class="eyebrow">NNECOO · COMPLETE</div><h1>ESCAPED!</h1><p>成功走出彩序迷宮</p><div id="results" class="results"></div><div class="modal-actions"><button id="play-again" type="button">重新開始</button><button id="next-level" type="button">下一關</button></div></div></div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
